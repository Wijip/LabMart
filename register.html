<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun Laboratorium Baru - LabMart Indonesia</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            },
            accent: '#f59e0b',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/custom.css?v=2" />
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header Minimal -->
  <header class="py-3 sm:py-4 px-3 sm:px-8 border-b border-slate-200 bg-white shadow-sm">
    <div class="container mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-1.5 sm:gap-2">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-teal-700 to-teal-500 text-white flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-lg sm:text-xl">science</span>
        </div>
        <span class="text-lg sm:text-xl font-black tracking-tight text-slate-900">Lab<span class="text-teal-600">Mart</span><span class="text-xs text-amber-500 ml-0.5">.id</span></span>
      </a>

      <div class="text-xs sm:text-sm text-slate-600 text-right font-medium">
        <span class="hidden sm:inline">Sudah memiliki akun? </span><a href="login.html" class="text-teal-700 font-extrabold hover:underline ml-1">Masuk Saja</a>
      </div>
    </div>
  </header>

  <!-- Register Card Container -->
  <main class="flex-1 flex items-center justify-center p-3 sm:p-6 my-4 sm:my-6">
    <div class="w-full max-w-xl bg-white rounded-2xl sm:rounded-3xl border border-slate-200/90 shadow-xl p-5 sm:p-8 space-y-5 sm:space-y-6">
      
      <!-- Heading -->
      <div class="text-center space-y-1.5">
        <div id="reg-header-icon" class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-700 border border-teal-200 flex items-center justify-center mx-auto mb-2 shadow-xs">
          <span class="material-symbols-outlined text-2xl">domain_add</span>
        </div>
        <h1 id="reg-header-title" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">Registrasi Akun Institusi Lab</h1>
        <p id="reg-header-desc" class="text-xs sm:text-sm text-slate-600 font-medium">Dapatkan akses pengadaan resmi, faktur pajak institusi, dan surat penawaran harga (RFQ)</p>
      </div>

      <!-- Pilihan Peran Pendaftaran (Buyer vs Seller) -->
      <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 rounded-2xl">
        <button 
          type="button" 
          id="role-tab-buyer"
          onclick="selectRegisterRole('buyer')" 
          class="py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-white text-teal-800 shadow-sm flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined text-base sm:text-lg">science</span>
          <span>Peneliti / Pembeli</span>
        </button>
        <button 
          type="button" 
          id="role-tab-seller"
          onclick="selectRegisterRole('seller')" 
          class="py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined text-base sm:text-lg">storefront</span>
          <span>Mitra Penjual (Seller)</span>
        </button>
      </div>

      <!-- Form Register -->
      <form id="register-form" class="space-y-4" onsubmit="handleRegisterSubmit(event)">
        <input type="hidden" id="reg-is-seller" value="false" />
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Nama Lengkap & Gelar *</label>
            <input 
              id="reg-name" 
              type="text" 
              required
              placeholder="Contoh: Dr. Budi Santoso, M.Si" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
            />
          </div>

          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Email Institusi / Resmi *</label>
            <input 
              id="reg-email" 
              type="email" 
              required
              placeholder="budi@kampus.ac.id" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Nama Universitas / Perusahaan *</label>
            <input 
              id="reg-institution" 
              type="text" 
              required
              placeholder="Contoh: Universitas Indonesia" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
            />
          </div>

          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Tipe Laboratorium *</label>
            <select 
              id="reg-labtype"
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-semibold text-slate-700"
            >
              <option value="Universitas / Pendidikan">Universitas / Pendidikan Tinggi</option>
              <option value="Industri / Farmasi / Pangan">Industri / Farmasi / QA Pangan</option>
              <option value="Rumah Sakit / Klinik Medis">Rumah Sakit / Laboratorium Klinis</option>
              <option value="Lembaga Riset Pemerintah">Lembaga Riset Pemerintah / BRIN</option>
              <option value="Sekolah / Praktikum SMA">Sekolah / Praktikum Menengah</option>
            </select>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Nama Laboratorium Spesifik</label>
          <input 
            id="reg-labname" 
            type="text" 
            placeholder="Contoh: Lab Kimia Organik & Bioteknologi Terpadu" 
            class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">No. WhatsApp / Telepon *</label>
            <input 
              id="reg-phone" 
              type="text" 
              required
              placeholder="08xxxxxxxxxx" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono-code font-bold text-slate-800"
            />
          </div>

          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Kota / Wilayah Lab</label>
            <input 
              id="reg-city" 
              type="text" 
              placeholder="Contoh: Kota Depok / Jakarta" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
            />
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Alamat Pengiriman Laboratorium</label>
          <textarea 
            id="reg-address" 
            rows="2"
            placeholder="Nama gedung, lantai, ruangan lab..."
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium leading-relaxed"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Kata Sandi *</label>
            <input 
              id="reg-password" 
              type="password" 
              required
              placeholder="Minimal 6 karakter" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
            />
          </div>

          <div class="space-y-1.5">
            <label class="text-xs sm:text-sm font-extrabold text-slate-800 block">Konfirmasi Kata Sandi *</label>
            <input 
              id="reg-confirm-password" 
              type="password" 
              required
              placeholder="Ulangi kata sandi" 
              class="w-full px-3.5 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium"
            />
          </div>
        </div>

        <div class="pt-2">
          <label class="flex items-start gap-2.5 cursor-pointer text-xs sm:text-sm text-slate-600 leading-snug">
            <input type="checkbox" required class="mt-0.5 w-4 h-4 rounded text-teal-600 focus:ring-teal-500 border-slate-300" />
            <span>Saya menyetujui <a href="#" class="text-teal-700 underline font-bold">Syarat & Ketentuan Pengadaan Bahan Kimia & Alat Lab</a> serta menyatakan data instansi di atas adalah benar.</span>
          </label>
        </div>

        <button 
          id="btn-register-submit"
          type="submit" 
          class="w-full py-3.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-black text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg shadow-teal-600/25 active:scale-[0.98] transition-all"
        >
          <span>Daftar Akun Laboratorium Baru</span>
          <span class="material-symbols-outlined text-xl">how_to_reg</span>
        </button>

      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-slate-500 text-xs sm:text-sm border-t border-slate-200 bg-white">
    &copy; 2026 LabMart Indonesia. Terdaftar di Kemenkes RI AKD. Seluruh hak cipta dilindungi.
  </footer>

  <script src="js/users.js"></script>
  <script src="js/store.js"></script>
  <script>
    function selectRegisterRole(role) {
      const isSeller = role === 'seller';
      document.getElementById('reg-is-seller').value = isSeller ? 'true' : 'false';

      const tabBuyer = document.getElementById('role-tab-buyer');
      const tabSeller = document.getElementById('role-tab-seller');
      const icon = document.getElementById('reg-header-icon');
      const title = document.getElementById('reg-header-title');
      const desc = document.getElementById('reg-header-desc');
      const submitBtn = document.getElementById('btn-register-submit');

      if (isSeller) {
        tabBuyer.className = "py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
        tabSeller.className = "py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-amber-500 text-white shadow-sm flex items-center justify-center gap-2";
        
        icon.className = "w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 border border-amber-300 flex items-center justify-center mx-auto mb-2";
        icon.innerHTML = `<span class="material-symbols-outlined text-2xl">storefront</span>`;
        title.textContent = "Buka Toko Mitra Penjual Lab";
        desc.textContent = "Daftarkan badan usaha distributor resmi atau toko alat lab Anda untuk mulai berjualan";
        
        if (submitBtn) {
          submitBtn.className = "w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-black text-sm sm:text-base shadow-md shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-2";
          submitBtn.innerHTML = `<span>Daftar & Buka Toko Mitra Lab</span><span class="material-symbols-outlined text-xl">storefront</span>`;
        }
      } else {
        tabBuyer.className = "py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-white text-teal-800 shadow-sm flex items-center justify-center gap-2";
        tabSeller.className = "py-3 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
        
        icon.className = "w-12 h-12 rounded-2xl bg-teal-50 text-teal-700 border border-teal-200 flex items-center justify-center mx-auto mb-2";
        icon.innerHTML = `<span class="material-symbols-outlined text-2xl">domain_add</span>`;
        title.textContent = "Registrasi Akun Institusi Lab";
        desc.textContent = "Dapatkan akses pengadaan resmi, faktur pajak institusi, dan surat penawaran harga (RFQ)";
        
        if (submitBtn) {
          submitBtn.className = "w-full py-3.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-black text-sm sm:text-base shadow-md shadow-teal-600/20 active:scale-95 transition-all flex items-center justify-center gap-2";
          submitBtn.innerHTML = `<span>Daftar Akun Laboratorium Baru</span><span class="material-symbols-outlined text-xl">how_to_reg</span>`;
        }
      }
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const isSeller = document.getElementById('reg-is-seller').value === 'true';
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const institution = document.getElementById('reg-institution').value.trim();
      const labType = document.getElementById('reg-labtype').value;
      const labName = document.getElementById('reg-labname').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const city = document.getElementById('reg-city').value.trim();
      const address = document.getElementById('reg-address').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        showToast('Konfirmasi kata sandi tidak cocok. Silakan periksa kembali.', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Kata sandi minimal harus 6 karakter.', 'warning');
        return;
      }

      const btn = document.getElementById('btn-register-submit');
      btn.disabled = true;
      btn.innerHTML = `<span class="material-symbols-outlined text-lg animate-spin">progress_activity</span> Mendaftarkan Akun...`;

      setTimeout(() => {
        const res = registerUser({
          name,
          email,
          password,
          institution,
          labName: labName || institution,
          labType: isSeller ? 'Distributor Resmi / Supplier Lab' : labType,
          phone,
          city,
          address,
          isSeller: isSeller,
          storeName: isSeller ? institution : ''
        }, false); // Tidak auto-login agar user dapat login secara manual di login.html

        if (res.success) {
          const urlParams = new URLSearchParams(window.location.search);
          const redirectTarget = urlParams.get('redirect') ? `&redirect=${encodeURIComponent(urlParams.get('redirect'))}` : '';
          
          showToast(`Akun "${institution}" berhasil didaftarkan dan tersimpan di database! Mengalihkan ke halaman login...`, 'success');
          
          setTimeout(() => {
            window.location.href = `login.html?registered=true&email=${encodeURIComponent(email)}${redirectTarget}`;
          }, 1000);
        } else {
          showToast(res.message, 'error');
          btn.disabled = false;
          if (isSeller) {
            btn.innerHTML = `<span>Daftar & Buka Toko Mitra Lab</span><span class="material-symbols-outlined text-lg">storefront</span>`;
          } else {
            btn.innerHTML = `<span>Daftar Akun Laboratorium Baru</span><span class="material-symbols-outlined text-lg">how_to_reg</span>`;
          }
        }
      }, 600);
    }

    // Teruskan parameter redirect jika ada
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        document.querySelectorAll('a[href="login.html"]').forEach(link => {
          link.href = `login.html?redirect=${encodeURIComponent(redirect)}`;
        });
      }
    });
  </script>
</body>
</html>
